# ArUco Object Perception - ROS2 Parameters Configuration
# Eurobot 2027 stones use ArUco ID 13; legacy crate IDs remain recognized.

aruco_crate_perception:
  ros__parameters:
    # ==================== CAMERA CONFIGURATION ====================
    
    # Camera image topic
    camera_topic: "/camera"
    
    # ==================== TEAM CONFIGURATION ====================
    
    # Target label: "stone" for 2027; use "all" to publish all recognized markers.
    team_color: "stone"
    
    # ==================== ARUCO PARAMETERS ====================
    
    # ArUco dictionary type
    # Verify the dictionary with the organizers; 2027 specifies ID 13 but not a dictionary.
    # Common options:
    #   - DICT_4X4_50
    #   - DICT_4X4_100
    #   - DICT_6X6_250
    aruco_dict: "DICT_4X4_50"
    
    # Provisional physical marker size (meters); verify on official stones before use.
    marker_size: 0.040
    
    # ==================== DETECTION THRESHOLDS ====================
    
    # Minimum confidence to accept detection (0.0 to 1.0)
    # Lower = more detections, but more false positives
    # Higher = fewer false positives, but might miss some stones
    # MUST MATCH your mission controller threshold!
    min_confidence: 0.35
    
    # Maximum distance to consider valid detection (meters)
    # Ignore far objects to reduce noise
    max_distance: 3.0
    
    # ==================== TF FRAME IDS ====================
    
    # Robot base frame
    base_frame: "base_link"
    
    # ==================== VISUALIZATION ====================
    
    # Enable debug visualization on /crate/image_debug topic
    # Shows detected markers with overlays
    # Disable for better performance in competition
    visualize: true


# ==================== ALTERNATIVE CONFIGURATIONS ====================

